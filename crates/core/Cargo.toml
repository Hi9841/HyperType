[package]
name = "hypertype-core"
version = "1.2.0"
description = "HyperType engine: keyboard hook, trigger matching, expansion and storage"
license = "MIT"
repository = "https://github.com/Hi9841/HyperType"
edition = "2021"
rust-version = "1.77"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_TextServices",
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_System_Time",
  "Win32_Media",
] }

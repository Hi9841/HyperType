[package]
name = "hypertype"
version = "1.1.8"
description = "HyperType - instant text expansion for Windows"
license = "MIT"
repository = "https://github.com/Hi9841/HyperType"
edition = "2024"
publish = false

[features]
default = []
# Pixel-parity judge: skip single-instance claim and keyboard hook, open the
# manager at a fixed size, and drive named UI states via --parity-state.
parity = []
# CLI: `hypertype --update-probe <version>` checks/downloads against the live feed.
update-probe = []

[dependencies]
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
global-hotkey = "0.9.0"
gpui-kit = "=0.7.3"
hypertype-core = { path = "../core" }
minisign-verify = "0.2"
rfd = "0.16"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3"
tray-icon = "0.26.1"
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

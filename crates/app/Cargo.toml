[package]
name = "hypertype"
version = "1.1.7"
description = "HyperType - instant text expansion for Windows"
license = "MIT"
repository = "https://github.com/Hi9841/HyperType"
edition = "2024"
publish = false

[dependencies]
async-channel = "2"
global-hotkey = "0.9.0"
gpui-kit = "=0.7.3"
hypertype-core = { path = "../core" }
serde_json = "1.0.154"
tray-icon = "0.26.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

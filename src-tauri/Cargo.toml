[package]
name = "hypertype"
version = "1.1.6"
description = "HyperType - instant text expansion for Windows"
authors = ["HyperType Contributors"]
license = "MIT"
repository = "https://github.com/Hi9841/HyperType"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"
hypertype-core = { path = "../crates/core" }

# Release profile tuned for a small, fast background binary.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
